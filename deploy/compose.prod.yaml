name: rock-matching

services:
  server:
    image: "${SERVER_IMAGE:?Set SERVER_IMAGE in .env.production}"
    platform: linux/amd64
    restart: unless-stopped

    user: "65532:65532"
    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    expose:
      - "3000"

    networks:
      - backend

    stop_grace_period: 30s

    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped

    depends_on:
      - server

    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN in .env.production}"
      ACME_EMAIL: "${ACME_EMAIL:?Set ACME_EMAIL in .env.production}"

    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"

    read_only: true

    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m

    cap_drop:
      - ALL

    cap_add:
      - NET_BIND_SERVICE

    security_opt:
      - no-new-privileges:true

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - edge
      - backend

    stop_grace_period: 10s

    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config: